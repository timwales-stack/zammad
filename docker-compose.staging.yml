# Black Raven Service Desk — Staging Environment
# Lightweight staging instance sharing Elasticsearch and Redis with production.
# Separate PostgreSQL and Memcached for data isolation.
#
# Usage:
#   docker compose -f docker-compose.staging.yml up -d
#   Open: http://localhost:8091
#
# Shares Elasticsearch and Redis with production via external network.
# Production network: blackraven-servicedesk_default

x-shared:
  zammad-staging: &zammad-staging
    image: ghcr.io/zammad/zammad:latest
    restart: unless-stopped
    networks:
      - staging
      - production
    environment: &zammad-staging-env
      MEMCACHE_SERVERS: zammad-staging-memcached:11211
      POSTGRESQL_DB: zammad_staging
      POSTGRESQL_HOST: zammad-staging-postgresql
      POSTGRESQL_USER: zammad_staging
      POSTGRESQL_PASS: ${STAGING_POSTGRES_PASS:-zammad_staging_dev}
      POSTGRESQL_PORT: "5432"
      REDIS_URL: redis://br-redis:6379/1
      ELASTICSEARCH_HOST: br-elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEMA: http
      ELASTICSEARCH_NAMESPACE: staging
      AUTOWIZARD_RELATIVE_PATH: autowizard.json
      RAILS_TRUSTED_PROXIES: "127.0.0.1,::1,172.16.0.0/12"
      ZAMMAD_HTTP_TYPE: https
      ZAMMAD_FQDN: staging-support.blackravenit.com
    volumes: &zammad-staging-volumes
      - zammad-staging-storage:/opt/zammad/storage
      - ./autowizard.json:/opt/zammad/autowizard.json:ro
      - ./custom/css/blackraven-theme.css:/opt/zammad/public/assets/blackraven-theme.css:ro
      - ./custom/logo.svg:/opt/zammad/public/assets/images/logo.svg:ro
      - ./custom/favicon.ico:/opt/zammad/public/favicon.ico:ro
      - ./custom/apple-touch-icon.png:/opt/zammad/public/apple-touch-icon.png:ro
      - ./custom/morpheus-logo.svg:/opt/zammad/public/assets/morpheus-logo.svg:ro
      - ./custom/inject-branding.sh:/docker-entrypoint.d/inject-branding.sh:ro
      - ./custom/nginx-default.conf:/etc/nginx/sites-enabled/default
      - ./custom/icons/logo.svg:/opt/zammad/public/assets/images/icons/logo.svg:ro
      - ./custom/icons/logotype.svg:/opt/zammad/public/assets/images/icons/logotype.svg:ro
      - ./custom/icons/full-logo.svg:/opt/zammad/public/assets/images/icons/full-logo.svg:ro

services:

  # ─── Staging Init (runs once) ──────────────────────────────
  zammad-staging-init:
    <<: *zammad-staging
    container_name: br-staging-init
    command: ["zammad-init"]
    restart: on-failure
    user: 0:0
    depends_on:
      - zammad-staging-postgresql

  # ─── Staging PostgreSQL (isolated from production) ─────────
  zammad-staging-postgresql:
    image: postgres:16-alpine
    container_name: br-staging-postgresql
    restart: unless-stopped
    networks:
      - staging
    environment:
      POSTGRES_USER: zammad_staging
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASS:-zammad_staging_dev}
      POSTGRES_DB: zammad_staging
    volumes:
      - staging-postgresql-data:/var/lib/postgresql/data

  # ─── Staging Memcached (isolated from production) ──────────
  zammad-staging-memcached:
    image: memcached:1.6-alpine
    container_name: br-staging-memcached
    command: memcached -m 128M
    restart: unless-stopped
    networks:
      - staging

  # ─── Staging Nginx (internal proxy) ────────────────────────
  zammad-staging-nginx:
    <<: *zammad-staging
    container_name: br-staging-nginx
    command: ["/bin/bash", "-c", "bash /docker-entrypoint.d/inject-branding.sh && exec /opt/zammad/bin/docker-entrypoint zammad-nginx"]
    ports:
      - "8091:8080"
    depends_on:
      - zammad-staging-railsserver

  # ─── Staging Rails Server ─────────────────────────────────
  zammad-staging-railsserver:
    <<: *zammad-staging
    container_name: br-staging-rails
    command: ["/bin/bash", "-c", "bash /docker-entrypoint.d/inject-branding.sh && exec /opt/zammad/bin/docker-entrypoint zammad-railsserver"]
    depends_on:
      - zammad-staging-init
      - zammad-staging-memcached
      - zammad-staging-postgresql

  # ─── Staging WebSocket ─────────────────────────────────────
  zammad-staging-websocket:
    <<: *zammad-staging
    container_name: br-staging-ws
    command: ["zammad-websocket"]
    depends_on:
      - zammad-staging-railsserver

  # ─── Staging Scheduler ─────────────────────────────────────
  zammad-staging-scheduler:
    <<: *zammad-staging
    container_name: br-staging-scheduler
    command: ["zammad-scheduler"]
    depends_on:
      - zammad-staging-railsserver

volumes:
  zammad-staging-storage:
  staging-postgresql-data:

networks:
  staging:
    driver: bridge
  production:
    external: true
    name: blackraven-servicedesk_default
