# Black Raven Service Desk — Nginx Reverse Proxy
# Handles SSL termination, WebSocket proxying, and security headers

upstream zammad-railsserver {
    server zammad-railsserver:3000;
}

upstream zammad-websocket {
    server zammad-websocket:6042;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;

    # Health check endpoint (no redirect)
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name support.blackravenit.com;

    # ─── SSL Configuration ─────────────────────────────
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ─── Security Headers ──────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss://$host; frame-ancestors 'self';" always;

    # ─── Rate Limiting ─────────────────────────────────
    # Defined in http block — applied per location
    # limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    # limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # ─── Request Limits ────────────────────────────────
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # ─── Logging ───────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # ─── WebSocket Proxy ───────────────────────────────
    location /ws {
        proxy_pass http://zammad-websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ─── NinjaOne Webhook Endpoint ─────────────────────
    # Proxied to ninja-bridge service
    location /api/ninja-webhook {
        proxy_pass http://ninja-bridge:3001/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ─── NinjaOne Bridge Health ────────────────────────
    location /api/ninja-health {
        proxy_pass http://ninja-bridge:3001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ─── Zammad Application ───────────────────────────
    location / {
        proxy_pass http://zammad-railsserver;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        # Buffering for large responses
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    # ─── Static Assets (Cache) ─────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://zammad-railsserver;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Block Sensitive Paths ─────────────────────────
    location ~ /\. {
        deny all;
    }

    location ~ ^/(config|db|log|script|spec|test)/ {
        deny all;
    }
}
