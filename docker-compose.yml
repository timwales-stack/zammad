# Black Raven Service Desk — Production Docker Compose
# Based on Zammad official docker-compose with security hardening
#
# Usage:
#   cp .env.example .env   # Fill in real values
#   docker compose up -d
#
# Requirements: Docker Engine 24+, Docker Compose v2

services:

  # ─── Reverse Proxy (SSL Termination) ─────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: br-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${SSL_CERT_PATH}:/etc/nginx/ssl/fullchain.pem:ro
      - ${SSL_KEY_PATH}:/etc/nginx/ssl/privkey.pem:ro
    depends_on:
      - zammad-railsserver
      - zammad-websocket
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Zammad Application Server ───────────────────────────
  zammad-railsserver:
    image: ghcr.io/zammad/zammad:latest
    container_name: br-zammad-rails
    restart: always
    command: ["zammad-railsserver"]
    environment:
      RAILS_ENV: production
      POSTGRESQL_HOST: ${POSTGRES_HOST}
      POSTGRESQL_PORT: ${POSTGRES_PORT}
      POSTGRESQL_USER: ${POSTGRES_USER}
      POSTGRESQL_PASS: ${POSTGRES_PASS}
      POSTGRESQL_DB: ${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST}
      ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT}
      ELASTICSEARCH_PASS: ${ELASTICSEARCH_PASS}
      ELASTICSEARCH_SCHEMA: ${ELASTICSEARCH_SCHEMA}
      ELASTICSEARCH_SSL_VERIFY: ${ELASTICSEARCH_SSL_VERIFY}
      ZAMMAD_RAILSSERVER_HOST: 0.0.0.0
    volumes:
      - zammad-data:/opt/zammad/storage
      - zammad-var:/opt/zammad/var
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/v1/monitoring/health_check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ─── Zammad WebSocket Server ─────────────────────────────
  zammad-websocket:
    image: ghcr.io/zammad/zammad:latest
    container_name: br-zammad-ws
    restart: always
    command: ["zammad-websocket"]
    environment:
      RAILS_ENV: production
      POSTGRESQL_HOST: ${POSTGRES_HOST}
      POSTGRESQL_PORT: ${POSTGRES_PORT}
      POSTGRESQL_USER: ${POSTGRES_USER}
      POSTGRESQL_PASS: ${POSTGRES_PASS}
      POSTGRESQL_DB: ${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      - zammad-railsserver
    networks:
      - backend

  # ─── Zammad Background Scheduler ────────────────────────
  zammad-scheduler:
    image: ghcr.io/zammad/zammad:latest
    container_name: br-zammad-scheduler
    restart: always
    command: ["zammad-scheduler"]
    environment:
      RAILS_ENV: production
      POSTGRESQL_HOST: ${POSTGRES_HOST}
      POSTGRESQL_PORT: ${POSTGRES_PORT}
      POSTGRESQL_USER: ${POSTGRES_USER}
      POSTGRESQL_PASS: ${POSTGRES_PASS}
      POSTGRESQL_DB: ${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST}
      ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT}
      ELASTICSEARCH_PASS: ${ELASTICSEARCH_PASS}
      ELASTICSEARCH_SCHEMA: ${ELASTICSEARCH_SCHEMA}
    depends_on:
      - zammad-railsserver
    networks:
      - backend

  # ─── PostgreSQL Database ─────────────────────────────────
  postgresql:
    image: postgres:16-alpine
    container_name: br-postgresql
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Cache ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: br-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_URL##*:}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Elasticsearch (Full-Text Search) ───────────────────
  elasticsearch:
    image: bitnami/elasticsearch:8
    container_name: br-elasticsearch
    restart: always
    environment:
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASS}
      ELASTICSEARCH_HEAP_SIZE: 1g
    volumes:
      - elasticsearch-data:/bitnami/elasticsearch/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── ClamAV (Attachment Scanning) ───────────────────────
  clamav:
    image: clamav/clamav:stable
    container_name: br-clamav
    restart: always
    volumes:
      - clamav-data:/var/lib/clamav
    networks:
      - backend
    healthcheck:
      test: ["CMD", "clamdcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ─── NinjaOne Bridge (Webhook Middleware) ────────────────
  ninja-bridge:
    build:
      context: ./ninja-bridge
      dockerfile: Dockerfile
    container_name: br-ninja-bridge
    restart: always
    environment:
      NINJAONE_CLIENT_ID: ${NINJAONE_CLIENT_ID}
      NINJAONE_CLIENT_SECRET: ${NINJAONE_CLIENT_SECRET}
      NINJAONE_INSTANCE_URL: ${NINJAONE_INSTANCE_URL}
      NINJAONE_WEBHOOK_SECRET: ${NINJAONE_WEBHOOK_SECRET}
      ZAMMAD_API_URL: ${ZAMMAD_API_URL}
      ZAMMAD_API_TOKEN: ${ZAMMAD_API_TOKEN}
      CLAMAV_HOST: ${CLAMAV_HOST}
      CLAMAV_PORT: ${CLAMAV_PORT}
      PORT: 3001
    depends_on:
      - zammad-railsserver
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

# ─── Volumes ──────────────────────────────────────────────
volumes:
  zammad-data:
    driver: local
  zammad-var:
    driver: local
  postgresql-data:
    driver: local
  redis-data:
    driver: local
  elasticsearch-data:
    driver: local
  clamav-data:
    driver: local

# ─── Networks ─────────────────────────────────────────────
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
